# ============================================================
#  Banco Tranquilo Worker - Integracao de Pagamentos
#  Consome:  pagamento-request-queue
#  Publica:  pagamento-response-sucesso-exchange / pagamento-response-erro-exchange
# ============================================================
spring:
  application:
    name: banco-tranquilo-worker
  main:
    web-application-type: none
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Para LavinMQ/CloudAMQP use: addresses: amqps://usuario:senha@host/vhost
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

# Nomes iguais aos criados na aula (exchanges, queues e routing keys)
mq:
  exchanges:
    request: pagamento-request-exchange
    sucesso: pagamento-response-sucesso-exchange
    erro: pagamento-response-erro-exchange
  queues:
    request: pagamento-request-queue
    sucesso: pagamento-response-sucesso-queue
    erro: pagamento-response-erro-queue
  routing-keys:
    request: pagamento-request-rout-key
    sucesso: pagamento-response-sucesso-rout-key
    erro: pagamento-response-erro-rout-key

# Regras da API simulada do Banco Tranquilo
banco:
  tranquilo:
    taxa-aprovacao: 0.85          # 85% das compras dentro do limite sao aprovadas
    limite-por-compra: 500.00     # acima disso o banco recusa (limite excedido)
    latencia-min-ms: 800
    latencia-max-ms: 2500

logging:
  level:
    br.com.fiap.bancotranquilo: INFO
